name: Desktop verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed installers using configured company certificates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path native/file-index/Cargo.toml --locked
      - run: cargo run --manifest-path native/file-index/Cargo.toml --example fixture --locked
      - run: npx playwright install chromium
      - run: npm run test:browser
        env:
          KIT_CI_BROWSER: chromium
      - name: Build development desktop
        if: ${{ !inputs.signed }}
        run: npm run desktop:build -- --no-bundle
      - name: Build signed macOS installer
        if: ${{ inputs.signed && runner.os == 'macOS' }}
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"
          npm run desktop:build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Import Windows signing certificate
        if: ${{ inputs.signed && runner.os == 'Windows' }}
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:CERTIFICATE) { throw 'WINDOWS_CERTIFICATE is required' }
          $certPath = Join-Path $env:RUNNER_TEMP 'kit-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERTIFICATE))
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force)
          "KIT_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build signed Windows installer
        if: ${{ inputs.signed && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $env:KIT_CERT_THUMBPRINT; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 -Compress
          npm run desktop:build -- --config $config
      - uses: actions/upload-artifact@v4
        with:
          name: kit-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/kit-desktop.exe
            src-tauri/target/release/kit-desktop
