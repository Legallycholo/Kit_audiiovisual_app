app = "mellow-ember-705"
primary_region = "cdg"

[build]

[env]
NODE_ENV = "production"
PORT = "8080"
KIT_DATABASE = "/data/kit.sqlite"
KIT_BACKUP_DIR = "/data/backups"
KIT_SECURE_COOKIES = "true"
KIT_ORIGINS = "https://mellow-ember-705.fly.dev"

[[mounts]]
source = "kit_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
