# fly.toml app configuration file generated for kit-audiiovisual-app on 2026-11-05T19:06:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kit-audiiovisual-app'
primary_region = 'dfw'

[build]
[env]
  KIT_BACKUP_DIR = '/data/backups'
  KIT_DATABASE = '/data/kit.sqlite'
  KIT_ORIGINS = 'https://mellow-ember-705.fly.dev'
  KIT_SECURE_COOKIES = 'true'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'kit_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
